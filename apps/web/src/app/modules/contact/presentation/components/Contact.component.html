<section id="contacte" class="px-4 py-12 sm:px-8">
  <h2>Tens alguna pregunta?</h2>
  <p>
    Som aquí per ajudar-te. Contacta'ns per obtenir informació detallada sobre els nostres
    programes.
  </p>
  <form>
    <label for="contact-name">Nom</label>
    <input id="contact-name" name="name" type="text" required />

    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" required />

    <label for="contact-subject">Assumpte</label>
    <input id="contact-subject" name="subject" type="text" required />

    <label for="contact-message">Missatge</label>
    <textarea id="contact-message" name="message" required></textarea>

    <button type="submit">Enviar Missatge</button>
  </form>
  <p>o uneix-te al nostre campus</p>
  <a href="https://discord.gg/ndPf6ZQjaG" target="_blank" rel="noopener noreferrer">
    Uneix-te al Campus a Discord
  </a>
</section>
